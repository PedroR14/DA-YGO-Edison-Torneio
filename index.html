<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07060f">
<meta name="description" content="Gerenciador de torneio suíço de Yu-Gi-Oh! com emparelhamento, desempate OWP/OOWP, top cut, cadastro de duelistas e histórico.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Duelistas Arretados – Torneio Suíço</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--card:#14112a;--card2:#1c1838;--ink:#f3ecd8;--mute:#a69cc4;--line:#3a3160;--gold:#d9b25a;--gold2:#f6dc8f;--gold3:#8a6a25;--acc:#d9b25a;--acc2:rgba(217,178,90,.14);--ok:#4fe0a0;--bad:#ff6b6b;--warn:#ffcf6b;--vio:#7b5cff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;
 background:
  radial-gradient(ellipse at 50% -10%,rgba(123,92,255,.35),transparent 60%),
  radial-gradient(ellipse at 100% 100%,rgba(217,178,90,.12),transparent 50%),
  repeating-linear-gradient(60deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(-60deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),
  var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(10,8,24,.97),rgba(10,8,24,.88));backdrop-filter:blur(6px);border-bottom:1px solid var(--gold3);box-shadow:0 2px 0 rgba(217,178,90,.15),0 8px 24px rgba(0,0,0,.5)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;max-width:720px;margin:0 auto}
.emb{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 8px rgba(217,178,90,.5))}
.ttl{flex:1;min-width:0}
h1{font:800 18px/1.1 Cinzel,serif;margin:0;letter-spacing:.06em;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase}
.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.status{font:600 11px Cinzel,serif;letter-spacing:.08em;color:var(--gold2);border:1px solid var(--gold3);padding:4px 9px;border-radius:4px;background:rgba(217,178,90,.08);white-space:nowrap}
nav{display:flex;gap:6px;padding:0 10px 10px;overflow-x:auto;max-width:720px;margin:0 auto}
nav button{flex:1;min-width:max-content;border:1px solid transparent;background:transparent;color:var(--mute);padding:7px 6px;border-radius:4px;font:700 11px Cinzel,serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
nav button.on{color:var(--gold2);border-color:var(--gold3);background:linear-gradient(180deg,rgba(217,178,90,.18),rgba(217,178,90,.04));box-shadow:inset 0 0 12px rgba(217,178,90,.15)}
main{max-width:720px;margin:0 auto;padding:16px 12px 80px}
.card{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--gold3);border-radius:6px;padding:16px;margin-bottom:14px;
 box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(217,178,90,.35),0 10px 30px rgba(0,0,0,.45)}
.card h2{font:800 14px Cinzel,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid rgba(217,178,90,.25)}
.card h2 .small{font-family:Inter,sans-serif;letter-spacing:0;text-transform:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:#0b0918;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
input:focus,select:focus{outline:none;border-color:var(--gold)}
input[type=text]{flex:1;min-width:0}
button.b{font:700 13px Cinzel,serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--gold3);background:rgba(217,178,90,.06);color:var(--gold2);border-radius:4px;padding:11px 14px;cursor:pointer}
button.p{background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,#a9822f);border-color:var(--gold2);color:#1a1206;box-shadow:0 0 18px rgba(217,178,90,.35),inset 0 1px 0 rgba(255,255,255,.5)}
button.d{color:var(--bad);border-color:rgba(255,107,107,.4);background:transparent}
button:disabled{opacity:.4;cursor:default;box-shadow:none}
.full{width:100%}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
.warn{font-size:13px;color:var(--warn);margin:6px 0 0}
ul.pl{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
ul.pl li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.25);font-weight:600}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:2px 6px;cursor:pointer}
.match{padding:12px 0;border-top:1px dashed rgba(217,178,90,.2)}
.card h2+.match{border-top:0;padding-top:4px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.mt>span{padding:9px 10px;border-radius:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.mt>span:last-child{text-align:right}
.mt .vs{background:none;border:0;padding:0;font:800 13px Cinzel,serif;color:var(--gold);text-shadow:0 0 10px rgba(217,178,90,.6)}
.mt .tb{font-size:11px;color:var(--mute);font-weight:600}
.mt span.w{border-color:var(--ok);box-shadow:0 0 12px rgba(79,224,160,.25),inset 0 0 10px rgba(79,224,160,.12);color:#d9ffee}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{font:700 13px Inter,sans-serif;padding:9px 2px;border:1px solid var(--line);background:#0b0918;color:var(--ink);border-radius:4px;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold2);color:#1a1206;box-shadow:0 0 10px rgba(217,178,90,.4)}
.seg.two button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 6px}
.byeline{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px dashed var(--line);border-radius:4px;font-weight:700}
.bye{color:var(--mute);font:700 11px Cinzel,serif;letter-spacing:.1em}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 10px Cinzel,serif;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
td.n,th.n{text-align:left;white-space:normal;font-weight:600}
td:first-child{font:800 13px Cinzel,serif;color:var(--gold2);text-align:center}
tbody tr:nth-child(-n+3) td:first-child{text-shadow:0 0 8px rgba(217,178,90,.7)}
tr.cut td{border-bottom:2px solid var(--gold)}
tr.drop td{opacity:.45}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;background:rgba(255,107,107,.15);color:var(--bad);font-weight:700;margin-left:6px;text-transform:uppercase;letter-spacing:.06em}
.champ{text-align:center;padding:26px 10px;background:radial-gradient(circle at 50% 0%,rgba(217,178,90,.3),transparent 70%),linear-gradient(160deg,var(--card2),var(--card))}
.champ .t{font:700 12px Cinzel,serif;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.champ .nm{font:800 28px Cinzel,serif;margin-top:6px;background:linear-gradient(180deg,#fff7d6,var(--gold) 60%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(217,178,90,.5))}
details.card{padding:12px 16px}
details summary{cursor:pointer;font:700 13px Cinzel,serif;letter-spacing:.08em;color:var(--gold2);text-transform:uppercase}
.small{font-size:12px;color:var(--mute)}
.sec{font:700 12px Cinzel,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:22px 4px 10px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold3),transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font:700 10px Cinzel,serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
label.f select,label.f input{width:100%;font:500 14px Inter,sans-serif;letter-spacing:0;text-transform:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1206;padding:10px 16px;border-radius:4px;font-weight:700;font-size:14px;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 0 20px rgba(217,178,90,.5)}
.toast.on{opacity:1}

.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:700;cursor:pointer;text-align:left;text-decoration:underline dotted rgba(217,178,90,.5);text-underline-offset:3px}
tr.sel td{background:rgba(217,178,90,.1)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.kp div{border:1px solid var(--line);border-radius:4px;padding:10px;background:rgba(0,0,0,.25);text-align:center}
.kp b{display:block;font:800 18px Cinzel,serif;color:var(--gold2)}
.kp span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
ul.hist{list-style:none;padding:0;margin:12px 0 0}
ul.hist li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed rgba(217,178,90,.2)}
.rn{font:700 12px Cinzel,serif;color:var(--gold)}
.rs{font-weight:800}.rs.ok{color:var(--ok)}.rs.bad{color:var(--bad)}
dl.leg{margin:12px 0 0;display:grid;grid-template-columns:80px 1fr;gap:8px 10px;font-size:13px}
dl.leg dt{font:700 12px Cinzel,serif;color:var(--gold2)}
dl.leg dd{margin:0;color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px Inter,sans-serif;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold2);color:#1a1206}
.chip.del{border-color:rgba(255,107,107,.5);color:var(--bad)}
textarea{font:inherit;color:var(--ink);background:#0b0918;border:1px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical;margin-top:8px}
details.sub2{margin-top:12px;border-top:1px dashed rgba(217,178,90,.25);padding-top:10px}
details.sub2 summary{font-size:12px}
.filebtn{display:inline-block}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.hc{font:700 13px Cinzel,serif;color:var(--gold2);text-align:right}
input:disabled{opacity:.6}

@media (max-width:400px){
 .top{gap:8px;padding:10px 12px 6px}
 .emb{width:30px;height:30px}
 h1{font-size:15px}
 .sub{font-size:10px;letter-spacing:.08em}
 .status{font-size:10px;padding:3px 6px;white-space:normal;text-align:center;max-width:96px}
 nav{flex-wrap:wrap;justify-content:center;gap:4px;padding:0 6px 8px}
 nav button{flex:0 1 auto;font-size:10.5px;padding:6px 8px}
 main{padding:12px 8px 70px}
 .card{padding:13px}
 table{font-size:13px}
 th,td{padding:7px 3px}
 .mt>span{padding:8px;font-size:14px}
 .seg button{font-size:12px}
 button.b{font-size:12px;padding:10px 12px}
}

.smt{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mt.sm>span{padding:6px}
.mt.sm select{width:100%;padding:8px 6px;font-size:14px;font-weight:600;background:#0b0918}
.mt.sm .tb{display:block;margin-top:3px}

.logo-mini{width:auto;height:46px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(123,92,255,.55))}
.hero{text-align:center;margin:4px 0 14px}
.hero img{width:min(78vw,330px);height:auto;filter:drop-shadow(0 0 18px rgba(123,92,255,.45)) drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.clogo{width:120px;height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 0 12px rgba(217,178,90,.45))}
@media (max-width:400px){.logo-mini{height:38px}}
</style>
</head>

    <div class="ttl"><h1>Duelistas Arretados</h1><div class="sub">Torneio Suíço</div></div>

<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const KEY='torneio-suico-ygo-v1';
const LOGO=()=>document.getElementById('logoimg').src;
const RES={A20:[2,0],A21:[2,1],D:[1,1],B21:[1,2],B20:[0,2]};
let S=load()||fresh();
let tab=S.phase==='setup'?'jog':'rod';

function fresh(){return{players:[],cfg:{rounds:0,top:4,drawPts:1},rounds:[],top:null,phase:'setup',nid:1,champion:null,name:'',formato:'',logId:null,startedAt:null,logDone:false}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function P(id){return S.players.find(p=>p.id===id)}
function nm(id){const p=P(id);return p?p.name:'?'}
function active(){return S.players.filter(p=>!p.dropped)}
function rec(n){return n<=2?1:Math.ceil(Math.log2(n))}
function nRounds(){return S.cfg.rounds||rec(S.players.length)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Estatísticas ---------- */
function stats(){
  const st={};
  S.players.forEach(p=>st[p.id]={id:p.id,pts:0,w:0,l:0,d:0,played:0,opps:[],bye:0,gw:0,gl:0});
  S.rounds.forEach(r=>r.matches.forEach(m=>{
    if(m.b==null){const a=st[m.a];a.pts+=3;a.w++;a.played++;a.bye++;return}
    if(!m.r)return;
    const a=st[m.a],b=st[m.b],[ga,gb]=RES[m.r];
    a.opps.push(m.b);b.opps.push(m.a);a.played++;b.played++;
    a.gw+=ga;a.gl+=gb;b.gw+=gb;b.gl+=ga;
    if(m.r==='D'){a.d++;b.d++;a.pts+=S.cfg.drawPts;b.pts+=S.cfg.drawPts}
    else if(m.r[0]==='A'){a.w++;b.l++;a.pts+=3}
    else{b.w++;a.l++;b.pts+=3}
  }));
  const mw=id=>{const s=st[id];return s.played?Math.max(1/3,s.pts/(3*s.played)):1/3};
  Object.values(st).forEach(s=>{s.mw=mw(s.id);s.owp=s.opps.length?s.opps.reduce((t,o)=>t+mw(o),0)/s.opps.length:0});
  Object.values(st).forEach(s=>{s.oowp=s.opps.length?s.opps.reduce((t,o)=>t+st[o].owp,0)/s.opps.length:0;s.gwp=(s.gw+s.gl)?s.gw/(s.gw+s.gl):0});
  Object.values(st).forEach(s=>{s.ogwp=s.opps.length?s.opps.reduce((t,o)=>t+Math.max(1/3,st[o].gwp),0)/s.opps.length:0;s.sw=s.w-s.bye;s.d20=0;s.d21=0});
  S.rounds.forEach(r=>r.matches.forEach(m=>{if(!m.r||m.b==null||m.r==='D')return;const w=m.r[0]==='A'?m.a:m.b;st[w][m.r[1]==='2'&&m.r[2]==='0'?'d20':'d21']++}));
  return st;
}
function standings(){
  const st=stats();
  return Object.values(st).sort((x,y)=>y.pts-x.pts||y.owp-x.owp||y.oowp-x.oowp||y.gwp-x.gwp||nm(x.id).localeCompare(nm(y.id)));
}

/* ---------- Emparelhamento suíço ---------- */
function playedSet(){const s=new Set();S.rounds.forEach(r=>r.matches.forEach(m=>{if(m.b!=null)s.add(k(m.a,m.b))}));return s}
function k(a,b){return a<b?a+'-'+b:b+'-'+a}
function pairList(list,played){
  let steps=0;
  function go(l){
    if(!l.length)return[];
    if(++steps>300000)return null;
    const p=l[0];
    for(let i=1;i<l.length;i++){
      const q=l[i];if(played.has(k(p,q)))continue;
      const rest=go(l.filter((_,j)=>j!==0&&j!==i));
      if(rest)return[[p,q],...rest];
    }
    return null;
  }
  return go(list);
}
function makePairings(){
  const act=active().map(p=>p.id);
  let ranked;
  if(!S.rounds.length)ranked=shuffle(act);
  else{
    const st=stats(),rnd={};act.forEach(id=>rnd[id]=Math.random());
    // ordena por pontos; dentro do mesmo grupo de pontos, ordem aleatória
    ranked=act.slice().sort((x,y)=>st[y].pts-st[x].pts||rnd[x]-rnd[y]);
  }
  const played=playedSet();
  const hadBye=new Set();S.rounds.forEach(r=>r.matches.forEach(m=>{if(m.b==null)hadBye.add(m.a)}));
  let bye=null,pairs=null,rematch=false;
  if(ranked.length%2){
    let cands=ranked.slice().reverse().filter(id=>!hadBye.has(id));
    if(!cands.length)cands=ranked.slice().reverse();
    for(const c of cands){const res=pairList(ranked.filter(x=>x!==c),played);if(res){bye=c;pairs=res;break}}
    if(!pairs){bye=cands[0];pairs=greedy(ranked.filter(x=>x!==bye));rematch=true}
  }else{
    pairs=pairList(ranked,played);
    if(!pairs){pairs=greedy(ranked);rematch=true}
  }
  const matches=pairs.map(([a,b])=>({a,b,r:null}));
  if(bye!=null)matches.push({a:bye,b:null,r:'BYE'});
  return{matches,rematch};
}
function greedy(l){const o=[];for(let i=0;i<l.length;i+=2)o.push([l[i],l[i+1]]);return o}

/* ---------- Top cut ---------- */
function seedOrder(n){let o=[1];while(o.length<n){const m=o.length*2;o=o.flatMap(s=>[s,m+1-s])}return o}
function startTop(){
  const size=S.cfg.top,sd=standings().filter(s=>!P(s.id).dropped).slice(0,size).map(s=>s.id);
  const ord=seedOrder(size),ms=[];
  for(let i=0;i<ord.length;i+=2)ms.push({a:sd[ord[i]-1],b:sd[ord[i+1]-1],r:null,sa:ord[i],sb:ord[i+1]});
  S.top={size,rounds:[ms]};S.phase='top';
}
function advanceTop(){
  const cur=S.top.rounds[S.top.rounds.length-1];
  if(cur.some(m=>!m.r))return;
  const win=cur.map(m=>m.r==='A'?{id:m.a,s:m.sa}:{id:m.b,s:m.sb});
  if(win.length===1){S.champion=win[0].id;S.phase='done';return}
  const ms=[];for(let i=0;i<win.length;i+=2)ms.push({a:win[i].id,b:win[i+1].id,r:null,sa:win[i].s,sb:win[i+1].s});
  S.top.rounds.push(ms);
}
function topName(n){return n===1?'Final':n===2?'Semifinal':n===4?'Quartas de final':'Top '+n*2}


/* ---------- Cadastro e histórico (salvos na conta quando possível) ---------- */
const RK='torneio-cadastro-v1',LK='torneio-logs-v1';
function lget(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const ST={cloud:false,db:null,uid:null,dl:null,roster:lget(RK,[]),logs:lget(LK,[]),q:Promise.resolve(),edit:false,filtro:'',histSel:null};
const low=x=>x.trim().toLocaleLowerCase('pt-BR');
function mergeNames(a,b){const m=new Map();[...a,...b].forEach(n=>{n=n.trim();if(n&&!m.has(low(n)))m.set(low(n),n)});return[...m.values()].sort((x,y)=>x.localeCompare(y,'pt-BR'))}
function timeout(p,ms=10000){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))])}
function rosterRef(){return ST.db.doc(`data/users/${ST.uid}/cadastro`)}
function logsCol(){return ST.db.doc(`data/users/${ST.uid}/app`).collection('torneios')}
function queue(fn){ST.q=ST.q.then(fn).catch(e=>{console.warn(e);if(e&&e.code==='quota_exceeded')toast('Espaço cheio: apague torneios antigos do histórico')});return ST.q}
function saveRoster(){lset(RK,ST.roster);if(ST.cloud){const names=ST.roster.slice();queue(()=>rosterRef().set({names,updatedAt:Date.now()}))}}
function addToRoster(names){const before=ST.roster.length;ST.roster=mergeNames(ST.roster,names);if(ST.roster.length!==before)saveRoster();return ST.roster.length-before}
function storeLog(log){const i=ST.logs.findIndex(l=>l.id===log.id);if(i>=0)ST.logs[i]=log;else ST.logs.push(log);lset(LK,ST.logs);
  if(ST.cloud)queue(()=>logsCol().doc(log.id).set(log))}
function deleteLog(id){ST.logs=ST.logs.filter(l=>l.id!==id);lset(LK,ST.logs);if(ST.cloud)queue(()=>logsCol().doc(id).delete())}
async function initCloud(){
  if(!window.claude||typeof claude.use!=='function')return;
  try{
    const [db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
    ST.dl=dl;render();
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    ST.db=db;ST.uid=uid;
    const snap=await timeout(rosterRef().get());
    const cloudNames=snap.exists?((snap.data()||{}).names||[]):[];
    const merged=mergeNames(cloudNames,ST.roster);
    const lq=await timeout(logsCol().get());
    const cloudLogs=lq.docs.map(d=>d.data()).filter(Boolean);
    ST.cloud=true;
    if(merged.length!==cloudNames.length){ST.roster=merged;saveRoster()}else{ST.roster=merged;lset(RK,merged)}
    const ids=new Set(cloudLogs.map(l=>l.id));
    const localOnly=ST.logs.filter(l=>!ids.has(l.id));
    ST.logs=[...cloudLogs,...localOnly];lset(LK,ST.logs);
    localOnly.forEach(l=>queue(()=>logsCol().doc(l.id).set(l)));
  }catch(e){console.warn('nuvem indisponível',e);ST.cloud=false}
  render();
}
async function download(filename,data){
  if(ST.dl){try{await ST.dl.save({filename,data});}catch(e){toast(e&&e.code==='declined'?'Download cancelado':'Não foi possível baixar')}return}
  try{const ext=filename.split('.').pop();const url=URL.createObjectURL(new Blob([data],{type:ext==='csv'?'text/csv;charset=utf-8':'text/plain;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  catch(e){toast('Não foi possível baixar. Use “Copiar”.')}
}
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}}
function parseNames(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let out=lines.length===1?lines[0].split(/[,;\t]+/):lines.map(l=>l.split(/[,;\t]/)[0]);
  return out.map(x=>x.replace(/^["']|["']$/g,'').replace(/^\d+\s*[\.\)\-–]\s*/,'').trim())
    .filter(x=>x&&!/^(nomes?|names?|jogador(es)?|duelistas?|players?)$/i.test(x));
}
function inscrito(n){return S.players.some(p=>low(p.name)===low(n))}
function inscrever(names){let c=0;names.forEach(n=>{if(!inscrito(n)){S.players.push({id:S.nid++,name:n.trim(),dropped:false});c++}});return c}
function defaultName(){const d=new Date(S.startedAt||Date.now());return 'Torneio Arretado '+d.toLocaleDateString('pt-BR')}
const fmtDate=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

function buildLog(){
  if(!S.logId)S.logId='t'+Date.now()+Math.random().toString(36).slice(2,6);
  const N=x=>x==null?null:nm(x),r4=v=>Math.round(v*10000)/10000,sd=standings();
  return{id:S.logId,name:S.name||defaultName(),formato:S.formato||'',startedAt:S.startedAt||Date.now(),savedAt:Date.now(),status:S.phase==='done'?'encerrado':'em andamento',
    cfg:{rounds:nRounds(),top:S.cfg.top,drawPts:S.cfg.drawPts},
    players:S.players.map(p=>({name:p.name,dropped:!!p.dropped})),
    rounds:S.rounds.map((r,i)=>({n:i+1,matches:r.matches.map((m,j)=>({mesa:j+1,a:N(m.a),b:N(m.b),r:m.r||null}))})),
    top:S.top?S.top.rounds.map(ms=>({fase:topName(ms.length),matches:ms.map(m=>({a:N(m.a),b:N(m.b),r:m.r||null,sa:m.sa,sb:m.sb}))})):[],
    champion:N(S.champion),
    standings:sd.map((x,i)=>({pos:i+1,name:nm(x.id),dropped:!!P(x.id).dropped,pts:x.pts,w:x.w,l:x.l,d:x.d,owp:r4(x.owp),oowp:r4(x.oowp),mw:r4(x.mw),gw:x.gw,gl:x.gl,gwp:r4(x.gwp),ogwp:r4(x.ogwp),d20:x.d20,d21:x.d21,bye:x.bye}))};
}
function saveLogNow(){storeLog(buildLog());save()}
function resTxt(m){
  if(m.b==null)return `${m.a} — BYE (vitória)`;
  if(!m.r)return `${m.a} vs ${m.b} — sem resultado`;
  if(m.r==='A'||m.r==='B')return `${m.r==='A'?m.a:m.b} venceu ${m.r==='A'?m.b:m.a}`;
  const [ga,gb]=RES[m.r];return m.r==='D'?`${m.a} ${ga}-${gb} ${m.b} (empate)`:`${m.a} ${ga}-${gb} ${m.b}`;
}
function logText(l){
  const p=v=>(v*100).toFixed(1)+'%',L=[];
  L.push('='.repeat(44),'DUELISTAS ARRETADOS [Card Game Store]',l.name.toUpperCase(),...(l.formato?['Formato: '+l.formato]:[]),'='.repeat(44));
  L.push(`Início: ${fmtDate(l.startedAt)}`,`Registro salvo: ${fmtDate(l.savedAt)} (${l.status})`);
  L.push(`Duelistas: ${l.players.length} · Rodadas suíças: ${l.rounds.length}/${l.cfg.rounds} · ${l.cfg.top?'Top '+l.cfg.top:'Sem top'} · Empate vale ${l.cfg.drawPts}`);
  if(l.champion)L.push('',`CAMPEÃO: ${l.champion}`);
  L.push('','CLASSIFICAÇÃO DO SUÍÇO','# | Duelista | Pts | V-D-E | OWP | OOWP | MW% | Games | GW% | OGW% | 2-0 | 2-1 | Bye');
  l.standings.forEach(x=>L.push(`${x.pos} | ${x.name}${x.dropped?' (drop)':''} | ${x.pts} | ${x.w}-${x.l}-${x.d} | ${p(x.owp)} | ${p(x.oowp)} | ${p(x.mw)} | ${x.gw}-${x.gl} | ${p(x.gwp)} | ${p(x.ogwp)} | ${x.d20} | ${x.d21} | ${x.bye}`));
  l.rounds.forEach(r=>{L.push('',`RODADA ${r.n}`);r.matches.forEach(m=>L.push(`  Mesa ${m.mesa}: ${resTxt(m)}`))});
  (l.top||[]).forEach(t=>{L.push('',t.fase.toUpperCase());t.matches.forEach(m=>L.push(`  (#${m.sa}) ${m.a} vs (#${m.sb}) ${m.b} → ${m.r?(m.r==='A'?m.a:m.b)+' venceu':'sem resultado'}`))});
  const drops=l.players.filter(x=>x.dropped).map(x=>x.name);if(drops.length)L.push('',`Drops: ${drops.join(', ')}`);
  return L.join('\n');
}
function logCsv(l){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`,p=v=>(v*100).toFixed(1).replace('.',',');
  const rows=[['Posição','Duelista','Drop','Pontos','Vitórias','Derrotas','Empates','OWP %','OOWP %','MW %','Games ganhos','Games perdidos','GW %','OGW %','Vitórias 2-0','Vitórias 2-1','Byes']];
  l.standings.forEach(x=>rows.push([x.pos,x.name,x.dropped?'sim':'',x.pts,x.w,x.l,x.d,p(x.owp),p(x.oowp),p(x.mw),x.gw,x.gl,p(x.gwp),p(x.ogwp),x.d20,x.d21,x.bye]));
  rows.push([]);rows.push(['Rodada','Mesa','Duelista A','Duelista B','Resultado']);
  l.rounds.forEach(r=>r.matches.forEach(m=>rows.push([r.n,m.mesa,m.a,m.b==null?'BYE':m.b,m.b==null?'bye':(m.r?(m.r==='D'?'empate 1-1':`${RES[m.r][0]}-${RES[m.r][1]}`):'')])));
  (l.top||[]).forEach(t=>t.matches.forEach(m=>rows.push([t.fase,'',m.a,m.b,m.r?(m.r==='A'?m.a:m.b)+' venceu':''])));
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}
const fileBase=l=>l.name.replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').toLowerCase()||'torneio';

/* ---------- Ações ---------- */
function act(a,el){
  if(a.startsWith('s_'))return simAct(a,el);
  const d=el.dataset;
  switch(a){
    case'add':{const i=document.getElementById('nome');const v=i.value.trim();if(!v)return;
      const ns=v.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
      const c=inscrever(ns);addToRoster(ns);if(c<ns.length)toast('Nome já inscrito ignorado');
      i.value='';break}
    case'tog':{const n=ST.roster[+d.i];if(n==null)return;
      if(ST.edit){ST.roster.splice(+d.i,1);saveRoster();toast(n+' removido do cadastro');render();return}
      if(inscrito(n))S.players=S.players.filter(p=>low(p.name)!==low(n));else inscrever([n]);break}
    case'all':{const vis=ST.roster.filter(n=>low(n).includes(low(ST.filtro)));const c=inscrever(vis);toast(c+' inscrito'+(c===1?'':'s'));break}
    case'none':{S.players=[];break}
    case'edit':ST.edit=!ST.edit;render();return;
    case'imp':{const t=document.getElementById('imp');const ns=parseNames(t.value);if(!ns.length)return toast('Nenhum nome encontrado');
      const c=addToRoster(ns);let msg=`${c} novo${c===1?'':'s'} no cadastro`;
      if(d.ins){const k=inscrever(ns);msg+=` · ${k} inscrito${k===1?'':'s'}`}
      t.value='';toast(msg);break}
    case'rcopy':copyText(ST.roster.join('\n'),'Cadastro copiado');return;
    case'rdl':download('cadastro-duelistas.txt',ST.roster.join('\r\n'));return;
    case'savelog':saveLogNow();toast('Registro salvo no histórico');render();return;
    case'hsel':ST.histSel=ST.histSel===d.id?null:d.id;render();return;
    case'hcopy':{const l=ST.logs.find(x=>x.id===d.id);if(l)copyText(logText(l),'Registro copiado');return}
    case'htxt':{const l=ST.logs.find(x=>x.id===d.id);if(l)download(fileBase(l)+'.txt',logText(l));return}
    case'hcsv':{const l=ST.logs.find(x=>x.id===d.id);if(l)download(fileBase(l)+'.csv',logCsv(l));return}
    case'hdel':deleteLog(d.id);ST.histSel=null;toast('Registro apagado');render();return;
    case'name':S.name=el.value.trim();save();return;
    case'formato':{S.formato=el.value.trim();
      const zero=/^(avan[cç]ado|advanced|tradicional|traditional)$/i.test(S.formato);
      if(S.phase==='setup'){
        if(zero&&S.cfg.drawPts!==0){S.cfg.drawPts=0;S.cfg.drawAuto=true;toast('Formato '+S.formato+': empate vale 0 ponto')}
        else if(!zero&&S.cfg.drawAuto){S.cfg.drawPts=1;S.cfg.drawAuto=false;toast('Empate voltou a valer 1 ponto')}
      }
      save();render();return}
    case'novo':S=fresh();tab='jog';break;
    case'rm':S.players=S.players.filter(p=>p.id!=d.id);break;
    case'cfg':S.cfg[d.k]=+el.value;if(d.k==='drawPts')S.cfg.drawAuto=false;break;
    case'start':{
      if(S.players.length<2)return toast('Adicione pelo menos 2 jogadores');
      S.phase='swiss';S.startedAt=Date.now();const {matches,rematch}=makePairings();S.rounds.push({matches});tab='rod';
      if(rematch)toast('Atenção: houve revanche inevitável');break}
    case'res':{const m=S.rounds[+d.r].matches[+d.m];m.r=m.r===d.v?null:d.v;break}
    case'next':{
      if(S.rounds[S.rounds.length-1].matches.some(m=>!m.r))return toast('Faltam resultados nesta rodada');
      const {matches,rematch}=makePairings();S.rounds.push({matches});
      if(rematch)toast('Atenção: houve revanche inevitável');break}
    case'extra':{S.cfg.rounds=nRounds()+1;break}
    case'undo':{S.rounds.pop();if(!S.rounds.length)S.phase='setup';break}
    case'drop':{const p=P(+d.id);p.dropped=!p.dropped;break}
    case'top':{
      if(S.cfg.top===0){S.champion=standings()[0].id;S.phase='done'}
      else{if(active().length<S.cfg.top)return toast('Jogadores insuficientes para o Top '+S.cfg.top);startTop()}
      tab=S.phase==='done'?'cla':'top';break}
    case'tres':{const m=S.top.rounds[+d.r][+d.m];
      const last=+d.r===S.top.rounds.length-1;if(!last)return toast('Rodada do top já fechada');
      m.r=m.r===d.v?null:d.v;break}
    case'tnext':advanceTop();break;
    case'tundo':{S.logDone=false;if(S.top.rounds.length>1)S.top.rounds.pop();else{S.top=null;S.phase='swiss'}S.champion=null;if(S.phase==='done')S.phase='top';break}
    case'reset':S=fresh();tab='jog';break;
    case'copy':{copyStandings();return}
    case'tab':tab=d.t;break;
    case'full':fullStats=!fullStats;render();return;
    case'det':detail=detail===+d.id?null:+d.id;render();return;
  }
  if(S.phase==='done'&&!S.logDone){S.logDone=true;storeLog(buildLog());setTimeout(()=>toast('Torneio salvo no histórico'),300)}
  else if(S.logId&&S.phase!=='setup'&&a!=='tab')storeLog(buildLog());
  save();render();
}
function confirmAct(a,el){

/* ---------- Telas ---------- */
function vJog(){

/* ---------- Simulador (não mexe no torneio real) ---------- */
const SK='torneio-sim-v1';
function simFresh(){return{players:[],cfg:{rounds:0,top:8,drawPts:1},rounds:[{matches:[]}],nid:1,topRes:{},sig:'',src:'Do zero'}}
let SIM=lget(SK,null)||simFresh();
function simSave(){lset(SK,SIM)}
function simView(){
  return{players:SIM.players,cfg:SIM.cfg,top:null,phase:'swiss',nid:SIM.nid,champion:null,
    rounds:SIM.rounds.map(r=>({matches:r.matches.filter(m=>m.a&&(m.bye||m.b)&&m.a!==m.b).map(m=>({a:m.a,b:m.bye?null:m.b,r:m.bye?'BYE':(m.r||null)}))}))};
}
function inSim(fn,upto){const keep=S;const v=simView();if(upto!=null)v.rounds=v.rounds.slice(0,upto);S=v;try{return fn()}finally{S=keep}}
function simIssues(ri){
  const r=SIM.rounds[ri],seen={},out=[];
  r.matches.forEach(m=>[m.a,m.bye?null:m.b].forEach(id=>{if(id)seen[id]=(seen[id]||0)+1}));
  const dup=Object.keys(seen).filter(k=>seen[k]>1).map(k=>inSim(()=>nm(+k)));
  if(dup.length)out.push('Em mais de uma mesa: '+dup.join(', '));
  const miss=SIM.players.filter(p=>!seen[p.id]).map(p=>p.name);
  if(miss.length&&r.matches.length)out.push('Sem mesa nesta rodada: '+miss.join(', '));
  const prev=new Set();SIM.rounds.slice(0,ri).forEach(x=>x.matches.forEach(m=>{if(m.a&&m.b&&!m.bye)prev.add(k(m.a,m.b))}));
  const re=r.matches.filter(m=>m.a&&m.b&&!m.bye&&prev.has(k(m.a,m.b))).map(m=>inSim(()=>nm(m.a)+' × '+nm(m.b)));
  if(re.length)out.push('Revanche: '+re.join(', '));
  const pend=r.matches.filter(m=>m.a&&m.b&&m.a!==m.b&&!m.bye&&!m.r).length;if(pend)out.push(pend+' mesa(s) sem resultado');
  return out;
}
function simLoadLog(l){
  const sim=simFresh();sim.src='Histórico: '+l.name;sim.cfg={rounds:0,top:l.cfg.top||8,drawPts:l.cfg.drawPts??1};
  const id={};l.players.forEach(p=>{id[low(p.name)]=sim.nid;sim.players.push({id:sim.nid++,name:p.name,dropped:false})});
  const g=n=>n==null?null:id[low(n)];
  sim.rounds=l.rounds.map(r=>({matches:r.matches.map(m=>m.b==null?{a:g(m.a),b:null,bye:true,r:null}:{a:g(m.a),b:g(m.b),r:m.r||null})}));
  if(!sim.rounds.length)sim.rounds=[{matches:[]}];
  return sim;
}
function simAct(a,el){
  const d=el.dataset;
  switch(a){
    case's_new':SIM=simFresh();break;
    case's_fold':{ST.simFold=ST.simFold||{};ST.simFold[+d.r]=d.o!=='1';render();return}
    case's_cad':ST.simCad=!ST.simCad;render();return;
    case's_cur':{if(!S.players.length)return toast('Não há torneio atual');
      SIM=simFresh();SIM.src='Cópia do torneio atual';SIM.cfg={rounds:0,top:S.cfg.top||8,drawPts:S.cfg.drawPts};
      SIM.players=S.players.map(p=>({id:p.id,name:p.name,dropped:false}));SIM.nid=S.nid;
      SIM.rounds=S.rounds.map(r=>({matches:r.matches.map(m=>m.b==null?{a:m.a,b:null,bye:true,r:null}:{a:m.a,b:m.b,r:m.r})}));
      if(!SIM.rounds.length)SIM.rounds=[{matches:[]}];toast('Torneio atual copiado');break}
    case's_log':{ST.simFold={};const l=ST.logs.find(x=>x.id===el.value);el.value='';if(!l)return;SIM=simLoadLog(l);toast('Carregado: '+l.name);break}
    case's_add':{const i=document.getElementById('snome');const ns=i.value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
      ns.forEach(n=>{if(!SIM.players.some(p=>low(p.name)===low(n)))SIM.players.push({id:SIM.nid++,name:n,dropped:false})});i.value='';break}
    case's_tog':{const n=ST.roster[+d.i];const p=SIM.players.find(x=>low(x.name)===low(n));
      if(p){if(simUsed(p.id))return toast(n+' já está em mesas da simulação');SIM.players=SIM.players.filter(x=>x!==p)}
      else SIM.players.push({id:SIM.nid++,name:n,dropped:false});break}
    case's_rmp':{const id=+d.id;if(simUsed(id))return toast('Tire esse duelista das mesas antes');SIM.players=SIM.players.filter(p=>p.id!==id);break}
    case's_A':case's_B':{const m=SIM.rounds[+d.r].matches[+d.m];const v=el.value;
      if(a==='s_A')m.a=v?+v:null;else{if(v==='bye'){m.bye=true;m.b=null;m.r=null}else{m.bye=false;m.b=v?+v:null}}break}
    case's_res':{const m=SIM.rounds[+d.r].matches[+d.m];m.r=m.r===d.v?null:d.v;break}
    case's_mesa':SIM.rounds[+d.r].matches.push({a:null,b:null,r:null});break;
    case's_rmm':SIM.rounds[+d.r].matches.splice(+d.m,1);break;
    case's_round':SIM.rounds.push({matches:[]});ST.simFold={};break;
    case's_rmr':SIM.rounds.splice(+d.r,1);if(!SIM.rounds.length)SIM.rounds=[{matches:[]}];break;
    case's_auto':{const ri=+d.r;if(SIM.players.length<2)return toast('Adicione duelistas');
      const res=inSim(()=>makePairings(),ri);
      SIM.rounds[ri].matches=res.matches.map(m=>m.b==null?{a:m.a,b:null,bye:true,r:null}:{a:m.a,b:m.b,r:null});
      if(res.rematch)toast('Atenção: revanche inevitável');break}
    case's_rand':{const ri=+d.r;const o=['A20','A21','B21','B20'];SIM.rounds[ri].matches.forEach(m=>{if(m.a&&m.b&&!m.bye&&!m.r)m.r=o[Math.floor(Math.random()*4)]});break}
    case's_clear':{SIM.rounds[+d.r].matches.forEach(m=>{if(!m.bye)m.r=null});break}
    case's_cfg':SIM.cfg[d.k]=+el.value;break;
    case's_top':{const key=d.k;SIM.topRes[key]=SIM.topRes[key]===d.v?null:d.v;break}
    case's_toapp':{ // leva os duelistas da simulação para o cadastro
      const c=addToRoster(SIM.players.map(p=>p.name));toast(c+' novo(s) no cadastro');return}
  }
  simSave();render();
}
function simUsed(id){return SIM.rounds.some(r=>r.matches.some(m=>m.a===id||m.b===id))}
function simBracket(seeds){
  // seeds: array de ids na ordem da classificação
  const n=SIM.cfg.top,ord=seedOrder(n);
  let cur=[];for(let i=0;i<ord.length;i+=2)cur.push({a:seeds[ord[i]-1],b:seeds[ord[i+1]-1],sa:ord[i],sb:ord[i+1]});
  const phases=[];let pi=0;
  while(cur.length){
    const ph={name:topName(cur.length),ms:cur.map((m,i)=>({...m,key:pi+'-'+i,r:SIM.topRes[pi+'-'+i]||null}))};phases.push(ph);
    if(cur.length===1||ph.ms.some(m=>!m.r))break;
    const w=ph.ms.map(m=>m.r==='A'?{id:m.a,s:m.sa}:{id:m.b,s:m.sb});
    cur=[];for(let i=0;i<w.length;i+=2)cur.push({a:w[i].id,b:w[i+1].id,sa:w[i].s,sb:w[i+1].s});pi++;
  }
  const last=phases[phases.length-1];
  const champ=last&&last.ms.length===1&&last.ms[0].r?(last.ms[0].r==='A'?last.ms[0].a:last.ms[0].b):null;
  return{phases,champ};
}

    const br=simBracket(seeds);
    html+=`<div class="card"><h2>Top ${cut} que daria</h2>
    ${br.champ!=null?`<div class="champ" style="padding:14px 0"><img class="clogo" src="${LOGO()}" alt=""><div class="t">★ Campeão simulado ★</div><div class="nm">${esc(nm(br.champ))}</div></div>`:''}
    ${br.phases.map((ph,pi)=>`<p class="small" style="margin:12px 0 4px;font:700 12px Cinzel,serif;letter-spacing:.1em;color:var(--gold)">${ph.name.toUpperCase()}</p>${ph.ms.map(m=>{
      const b=(v,l)=>`<button class="${m.r===v?'on':''}" data-a="s_top" data-k="${m.key}" data-v="${v}">${l}</button>`;
      return `<div class="match"><div class="mt"><span class="${m.r==='A'?'w':''}"><span class="tb">Seed #${m.sa}</span><br>${esc(nm(m.a))}</span><span class="vs">VS</span><span class="${m.r==='B'?'w':''}"><span class="tb">Seed #${m.sb}</span><br>${esc(nm(m.b))}</span></div><div class="seg two">${b('A','◀ Venceu')}${b('B','Venceu ▶')}</div></div>`}).join('')}`).join('')}
    <p class="hint">Escolha os vencedores para ver o chaveamento até a final. Se a tabela mudar, o top recomeça.</p></div>`;
  }else if(cut&&ps.length)html+=`<div class="card"><p class="hint">São necessários pelo menos ${cut} duelistas para simular o Top ${cut}.</p></div>`;
  return html;
})}
function matchView(m,ri,mi,st){
  if(m.b==null)return `<div class="match"><div class="byeline"><span>${esc(nm(m.a))}</span><span class="bye">BYE · VITÓRIA</span></div></div>`;
  const b=(v,l)=>`<button class="${m.r===v?'on':''}" data-a="res" data-r="${ri}" data-m="${mi}" data-v="${v}">${l}</button>`;
  const wa=m.r&&m.r[0]==='A',wb=m.r&&m.r[0]==='B';
  return `<div class="match"><div class="mt"><span class="${wa?'w':''}">${esc(nm(m.a))}<br><span class="tb">${st[m.a].pts} pts</span></span><span class="vs">VS</span><span class="${wb?'w':''}">${esc(nm(m.b))}<br><span class="tb">${st[m.b].pts} pts</span></span></div>
  <div class="seg">${b('A20','2-0')}${b('A21','2-1')}${b('D','Emp')}${b('B21','1-2')}${b('B20','0-2')}</div></div>`;
}
function vRod(){
  if(!S.rounds.length)return `<div class="card"><p class="hint">Adicione os duelistas e inicie o torneio na aba Duelistas.</p></div>`;
  const ri=S.rounds.length-1,cur=S.rounds[ri],st=stats(),total=nRounds();
  const done=cur.matches.every(m=>m.r),last=S.rounds.length>=total;
  const swiss=S.phase==='swiss';
  // estatísticas antes da rodada atual para mostrar pontos
  const before=statsUntil(ri);
  let actions='';
  if(swiss){
    if(!last)actions=`<button class="b p full" data-a="next" ${done?'':'disabled'}>Gerar rodada ${ri+2} de ${total}</button>`;
    else actions=`<button class="b p full" data-a="top" ${done?'':'disabled'}>${S.cfg.top?'Encerrar suíço e iniciar Top '+S.cfg.top:'Encerrar torneio'}</button>
      <p style="margin-top:8px"><button class="b full" data-a="extra" ${done?'':'disabled'}>+ Adicionar mais uma rodada suíça</button></p>`;
    actions+=`<p style="text-align:center;margin-top:14px"><button class="b d" data-c="undo">Desfazer rodada ${ri+1}</button></p>`;
  }
  const hist=S.rounds.slice(0,swiss?ri:ri+1).map((r,i)=>{const b4=statsUntil(i);return `<details class="card"><summary>Rodada ${i+1}</summary>${r.matches.map((m,mi)=>matchView(m,i,mi,b4)).join('')}</details>`}).reverse().join('');
  return `${swiss?`<div class="card"><h2>Rodada ${ri+1} de ${total} <span class="small">· ${cur.matches.filter(m=>m.r).length}/${cur.matches.length} resultados</span></h2>
    ${cur.matches.map((m,mi)=>matchView(m,ri,mi,before)).join('')}</div>${actions}`:''}
    ${hist?`<h2 class="sec">${swiss?'Rodadas anteriores (dá pra corrigir resultado)':'Rodadas suíças'}</h2>${hist}`:''}`;
}
function statsUntil(ri){const keep=S.rounds;S.rounds=keep.slice(0,ri);const s=stats();S.rounds=keep;return s}
let fullStats=false,detail=null;
const pct=v=>(v*100).toFixed(1)+'%';
function vCla(){
  if(!S.rounds.length)return `<div class="card"><p class="hint">A classificação aparece depois da 1ª rodada.</p></div>`;
  const sd=standings(),cut=S.cfg.top,sw=S.phase==='swiss';let pos=0;
  const champ=S.champion!=null?`<div class="card champ"><img class="clogo" src="${LOGO()}" alt=""><div class="t">★ Campeão ★</div><div class="nm">${esc(nm(S.champion))}</div></div>`:'';
  const F=fullStats;
  const head=`<tr><th>#</th><th class="n">Duelista</th><th>Pts</th><th>V-D-E</th><th>OWP</th><th>OOWP</th>${F?'<th>MW%</th><th>Partidas</th><th>GW%</th><th>OGW%</th><th>2-0</th><th>2-1</th><th>Bye</th>':''}${sw?'<th></th>':''}</tr>`;
  const rows=sd.map(s=>{const p=P(s.id);if(!p.dropped)pos++;const c=!p.dropped&&cut&&pos===cut&&sd.length>cut;
    return `<tr class="${c?'cut':''} ${p.dropped?'drop':''} ${detail===s.id?'sel':''}"><td>${p.dropped?'–':pos}</td><td class="n"><button class="lnk" data-a="det" data-id="${s.id}">${esc(p.name)}</button>${p.dropped?'<span class="pill">drop</span>':''}</td><td><b>${s.pts}</b></td><td>${s.w}-${s.l}-${s.d}</td><td>${pct(s.owp)}</td><td>${pct(s.oowp)}</td>${F?`<td>${pct(s.mw)}</td><td>${s.gw}-${s.gl}</td><td>${pct(s.gwp)}</td><td>${pct(s.ogwp)}</td><td>${s.d20}</td><td>${s.d21}</td><td>${s.bye}</td>`:''}${sw?`<td><button class="x" style="font-size:12px" data-a="drop" data-id="${s.id}">${p.dropped?'Voltar':'Drop'}</button></td>`:''}</tr>`}).join('');
  return `${champ}<div class="card"><h2>Classificação após ${S.rounds.length} rodada${S.rounds.length>1?'s':''}</h2>
  <div class="row" style="margin-bottom:8px"><button class="b ${F?'p':''}" data-a="full">${F?'Ocultar estatísticas extras':'Ver todas as estatísticas'}</button></div>
  <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
  ${cut?`<p class="hint">A linha dourada marca o corte do Top ${cut}. Toque no nome de um duelista para ver o histórico.</p>`:'<p class="hint">Toque no nome de um duelista para ver o histórico.</p>'}
  <div class="row" style="margin-top:10px"><button class="b" data-a="copy">Copiar classificação</button><button class="b" data-a="savelog">Salvar registro</button></div>
  ${S.phase==='done'?'<p style="margin-top:10px"><button class="b p full" data-c="novo">Novo torneio</button></p>':''}</div>
  ${detail!=null&&P(detail)?vDet(detail):''}
  ${vResumo()}
  <details class="card"><summary>O que significa cada estatística</summary>
  <dl class="leg">
   <dt>Pts</dt><dd>Pontos de partida: vitória 3, empate ${S.cfg.drawPts}, derrota 0. Bye vale vitória.</dd>
   <dt>V-D-E</dt><dd>Vitórias, derrotas e empates em partidas (melhor de 3).</dd>
   <dt>OWP</dt><dd>Opponents' Win Percentage: média do MW% dos seus adversários. É o 1º desempate. Quanto mais forte foi o caminho, maior.</dd>
   <dt>OOWP</dt><dd>Média do OWP dos seus adversários. É o 2º desempate.</dd>
   <dt>MW%</dt><dd>Match Win %: seus pontos ÷ (3 × partidas jogadas). Mínimo de 33,3% para não punir quem enfrentou alguém que foi mal.</dd>
   <dt>Partidas</dt><dd>Games vencidos e perdidos somando todos os confrontos (ex.: 2-1 conta 2 ganhos e 1 perdido).</dd>
   <dt>GW%</dt><dd>Game Win %: games vencidos ÷ games jogados. 3º desempate neste app.</dd>
   <dt>OGW%</dt><dd>Média do GW% dos adversários (mínimo 33,3%).</dd>
   <dt>2-0 / 2-1</dt><dd>Quantas vitórias foram limpas (2-0) e quantas foram no game 3 (2-1).</dd>
   <dt>Bye</dt><dd>Rodadas em que ficou sem adversário.</dd>
  </dl>
  <p class="hint">Ordem de desempate: Pts → OWP → OOWP → GW%. Torneios oficiais Konami usam Pts → OWP → OOWP; GW% só entra se ainda houver empate.</p></details>`;
}
function vDet(id){
  const st=stats(),s=st[id];let html='';
  S.rounds.forEach((r,i)=>r.matches.forEach(m=>{
    if(m.a!==id&&m.b!==id)return;
    if(m.b==null){html+=`<li><span class="rn">R${i+1}</span><span class="op">Bye</span><span class="rs ok">V</span></li>`;return}
    const me=m.a===id,op=me?m.b:m.a,o=st[op];
    let tag='–',cls='',sc='';
    if(m.r){const [ga,gb]=RES[m.r];const g1=me?ga:gb,g2=me?gb:ga;sc=`${g1}-${g2}`;tag=m.r==='D'?'E':(g1>g2?'V':'D');cls=tag==='V'?'ok':tag==='D'?'bad':''}
    html+=`<li><span class="rn">R${i+1}</span><span class="op">${esc(nm(op))} <span class="small">(${o.w}-${o.l}-${o.d})</span></span><span class="rs ${cls}">${tag} ${sc}</span></li>`;
  }));
  if(S.top)S.top.rounds.forEach(ms=>ms.forEach(m=>{
    if(m.a!==id&&m.b!==id)return;const me=m.a===id,op=me?m.b:m.a;
    const tag=!m.r?'–':((m.r==='A')===me?'V':'D');
    html+=`<li><span class="rn">${topName(ms.length).replace('Quartas de final','QF').replace('Semifinal','SF')}</span><span class="op">${esc(nm(op))}</span><span class="rs ${tag==='V'?'ok':tag==='D'?'bad':''}">${tag}</span></li>`;
  }));
  const strk=(()=>{let n=0,t='';const res=[];S.rounds.forEach(r=>r.matches.forEach(m=>{if(m.a!==id&&m.b!==id)return;if(m.b==null)res.push('V');else if(m.r)res.push(m.r==='D'?'E':((m.r[0]==='A')===(m.a===id)?'V':'D'))}));for(let i=res.length-1;i>=0;i--){if(!t)t=res[i];if(res[i]!==t)break;n++}return n?`${n} ${t==='V'?'vitória':t==='D'?'derrota':'empate'}${n>1?(t==='V'?'s':t==='D'?'s':'s'):''} seguida${n>1?'s':''}`:'—'})();
  return `<div class="card"><h2>${esc(nm(id))} <button class="x" data-a="det" data-id="${id}" style="float:right;margin-top:-4px">×</button></h2>
  <div class="kp"><div><b>${s.pts}</b><span>pts</span></div><div><b>${s.w}-${s.l}-${s.d}</b><span>V-D-E</span></div><div><b>${s.gw}-${s.gl}</b><span>games</span></div><div><b>${pct(s.owp)}</b><span>OWP</span></div></div>
  <ul class="hist">${html}</ul><p class="hint">Sequência atual: ${strk}</p></div>`;
}
function vResumo(){
  let m=0,d=0,g20=0,g21=0,games=0,byes=0;
  S.rounds.forEach(r=>r.matches.forEach(x=>{if(x.b==null){byes++;return}if(!x.r)return;m++;const[a,b]=RES[x.r];games+=a+b;if(x.r==='D')d++;else if(a+b===2)g20++;else g21++}));
  if(!m)return'';
  return `<div class="card"><h2>Resumo do torneio</h2><div class="kp">
   <div><b>${m}</b><span>partidas</span></div><div><b>${games}</b><span>games</span></div>
   <div><b>${pct(g20/m)}</b><span>vitórias 2-0</span></div><div><b>${pct(g21/m)}</b><span>foram ao game 3</span></div>
   <div><b>${d}</b><span>empates</span></div><div><b>${byes}</b><span>byes</span></div></div></div>`;
}
function vTop(){
  if(!S.top)return `<div class="card"><p class="hint">${S.cfg.top?`O Top ${S.cfg.top} começa quando terminar o suíço.`:'Este torneio está configurado sem top.'}</p></div>`;
  const R=S.top.rounds,li=R.length-1;
  const html=R.map((ms,ri)=>`<div class="card"><h2>${topName(ms.length)}</h2>${ms.map((m,mi)=>{
    const b=(v,l)=>`<button class="${m.r===v?'on':''}" data-a="tres" data-r="${ri}" data-m="${mi}" data-v="${v}" ${ri!==li||S.phase==='done'?'disabled':''}>${l}</button>`;
    return `<div class="match"><div class="mt"><span class="${m.r==='A'?'w':''}"><span class="tb">Seed #${m.sa}</span><br>${esc(nm(m.a))}</span><span class="vs">VS</span><span class="${m.r==='B'?'w':''}"><span class="tb">Seed #${m.sb}</span><br>${esc(nm(m.b))}</span></div>
    <div class="seg two">${b('A','◀ Venceu')}${b('B','Venceu ▶')}</div></div>`}).join('')}</div>`).join('');
  const done=R[li].every(m=>m.r);
  const champ=S.champion!=null?`<div class="card champ"><img class="clogo" src="${LOGO()}" alt=""><div class="t">★ Campeão ★</div><div class="nm">${esc(nm(S.champion))}</div></div>`:'';
  return champ+html+(S.phase==='top'?`<button class="b p full" data-a="tnext" ${done?'':'disabled'}>${R[li].length===1?'Confirmar campeão':'Avançar para '+topName(R[li].length/2)}</button>`:'')+
    `<p style="text-align:center;margin-top:14px"><button class="b d" data-c="tundo">Desfazer última fase do top</button></p>`;
}
function render(){
  const tabs=[['jog','Duelistas'],['rod','Rodadas'],['cla','Tabela']];
  if(S.cfg.top)tabs.push(['top','Top '+S.cfg.top]);
  tabs.push(['sim','Simulador'],['his','Histórico']);
  if(!tabs.some(t=>t[0]===tab))tab='jog';
  document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`).join('');
  const ph0={setup:'Preparando',swiss:`Suíço · rodada ${S.rounds.length}/${nRounds()}`,top:'Top cut',done:'Encerrado'}[S.phase];const ph=(S.formato?S.formato+' · ':'')+ph0;
  document.getElementById('status').textContent=ph;
  document.getElementById('app').innerHTML={jog:vJog,rod:vRod,cla:vCla,top:vTop,his:vHist,sim:vSim}[tab]();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a],[data-c]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT'||el.disabled)return;
  if(el.dataset.c)confirmAct(el.dataset.c,el);else act(el.dataset.a,el);
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='impf'&&el.files&&el.files[0]){const f=el.files[0];f.text().then(t=>{const ta=document.getElementById('imp');if(ta){ta.value=(ta.value?ta.value+'\n':'')+t;toast(parseNames(t).length+' nomes lidos de '+f.name)}}).catch(()=>toast('Não foi possível ler o arquivo'));el.value='';return}
  if(el.dataset.a==='name'||el.dataset.a==='formato'){act(el.dataset.a,el);return}
  if(el.tagName==='SELECT'&&el.dataset.a)act(el.dataset.a,el)});
document.addEventListener('input',e=>{if(e.target.id==='busca'){ST.filtro=e.target.value;const c=document.getElementById('chips');if(c)c.innerHTML=chips()}});
render();
initCloud();
</script>
</body>
</html>
